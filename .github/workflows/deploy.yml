name: build-scan-push
# Phase-2 CI (hosh.it): build -> Trivy gate (CRITICAL) -> push ghcr :ci + :sha.
# Deliberately does NOT touch :latest — the box runs known-good mirrors. Promote a
# validated build with: docker buildx imagetools create -t ghcr.io/pazka/wixtocitations:latest ghcr.io/pazka/wixtocitations:<sha>
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: V_citations
          load: true
          tags: ghcr.io/pazka/wixtocitations:candidate
      - name: Trivy gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/pazka/wixtocitations:candidate
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: push ci + sha tags
        if: success()
        run: |
          docker tag ghcr.io/pazka/wixtocitations:candidate ghcr.io/pazka/wixtocitations:ci
          docker tag ghcr.io/pazka/wixtocitations:candidate ghcr.io/pazka/wixtocitations:${{ github.sha }}
          docker push ghcr.io/pazka/wixtocitations:ci
          docker push ghcr.io/pazka/wixtocitations:${{ github.sha }}
